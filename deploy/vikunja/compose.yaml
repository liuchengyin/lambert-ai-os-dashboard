# Local trial only. Publish to a server only after setting a real HTTPS PUBLICURL.
services:
  vikunja:
    image: vikunja/vikunja:2.7.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:3456:3456"
    environment:
      VIKUNJA_SERVICE_PUBLICURL: "http://localhost:3456/"
      VIKUNJA_SERVICE_SECRET: "${VIKUNJA_SERVICE_SECRET:?Set a random secret in .env before startup}"
      VIKUNJA_DATABASE_TYPE: sqlite
      VIKUNJA_DATABASE_PATH: /db/vikunja.db
    volumes:
      - ./db:/db
      - ./files:/app/vikunja/files
