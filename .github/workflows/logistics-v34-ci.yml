name: Logistics V3.4 linehaul prerequisites regression
on:
  push:
    branches: [feat/logistics-v34-linehaul-prereqs-20261028]
    paths:
      - '.github/workflows/logistics-v34-ci.yml'
      - 'logistics-setup-v34.js'
      - 'logistics-setup-v34.css'
      - 'logistics-knowledge-v1.js'
      - 'logistics-stage-view.js'
      - 'logistics-overview.js'
      - 'index.html'
      - 'tests/logistics-v34-setup-model.test.mjs'
      - 'tests/logistics-v34-ui.mjs'
permissions:
  contents: read
jobs:
  setup-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and safe storage/model regressions
        run: |
          node --check logistics-knowledge-v1.js
          node --check logistics-stage-view.js
          node --check logistics-overview.js
          node --check logistics-setup-v34.js
          node tests/logistics-v34-setup-model.test.mjs
          node tests/logistics-v33-trigger-model.test.mjs
          node tests/logistics-version-model.test.mjs
          node tests/logistics-v31-model.test.mjs
          node tests/logistics-flow-model.test.mjs
      - name: Install Chromium for realistic page checks
        run: |
          npm install --no-save --no-package-lock playwright@1.56.0
          npx playwright install --with-deps chromium
      - name: Test sea-land-air preconfiguration, save and release
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/logistics-v34-server.log 2>&1 &
          sleep 2
          TEST_ORIGIN=http://127.0.0.1:8765 node tests/logistics-v34-ui.mjs
