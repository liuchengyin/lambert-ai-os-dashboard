name: Flow Atlas Flash Contribution
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: One bounded Flash call
        env:
          DEEPSEEK_REVIEW_API_KEY: ${{ secrets.DEEPSEEK_REVIEW_API_KEY }}
        run: node scripts/review-flow-atlas.mjs --run
      - uses: actions/upload-artifact@v4
        with:
          name: flow-atlas-flash
          path: review-output/flow-atlas/
          retention-days: 14
