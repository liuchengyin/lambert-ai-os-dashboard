name: Overdue task DeepSeek draft
on:
  push:
    branches: [feat/android-overdue-tasks]
    paths: ['.github/workflows/overdue-assist.yml']
permissions:
  contents: read
jobs:
  assist:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: One bounded DeepSeek draft
        env:
          DEEPSEEK_REVIEW_API_KEY: ${{ secrets.DEEPSEEK_REVIEW_API_KEY }}
        run: node scripts/codex/model-assist.mjs --provider deepseek --task draft --prompt-file docs/assist/overdue-request.md --file mobile/task-model.js --file mobile/project-stats.js --run
      - name: Print actual report
        run: |
          node --input-type=module <<'JS'
          import {readdir,readFile} from 'node:fs/promises';
          for(const n of await readdir('.codex-local/assist'))if(n!=='ledger.json'&&n.endsWith('.json'))console.log(await readFile('.codex-local/assist/'+n,'utf8'));
          JS
