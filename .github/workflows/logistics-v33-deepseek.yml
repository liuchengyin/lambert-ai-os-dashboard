name: Logistics V3.3 DeepSeek Flash safety review
on:
  push:
    branches: [feat/logistics-v33-triggers-soft-stages-20261028]
    paths: ['.github/workflows/logistics-v33-deepseek.yml']
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Estimate model usage with no provider requests
        run: node scripts/codex/model-assist.mjs --provider deepseek --task review --prompt-file docs/logistics-v33-deepseek-prompt.md --file logistics-trigger-v33.js
      - name: One DeepSeek Flash review
        env:
          DEEPSEEK_REVIEW_API_KEY: ${{ secrets.DEEPSEEK_REVIEW_API_KEY }}
        run: node scripts/codex/model-assist.mjs --provider deepseek --task review --prompt-file docs/logistics-v33-deepseek-prompt.md --file logistics-trigger-v33.js --run
      - name: Print findings and exact token usage
        if: success()
        run: |
          node --input-type=module - <<'JS'
          import fs from 'node:fs';
          const files=fs.readdirSync('.codex-local/assist').filter(f=>f.endsWith('.json')&&f!=='ledger.json');
          const result=files.map(f=>JSON.parse(fs.readFileSync('.codex-local/assist/'+f,'utf8'))).find(x=>x.provider==='deepseek'&&x.task==='review');
          if(!result)throw Error('review_not_found');
          console.log(JSON.stringify({model:result.reportedModel,usage:result.usage,retries:result.retries}));
          console.log('DEEPSEEK_FINDINGS_START\n'+result.output.slice(0,3500)+'\nDEEPSEEK_FINDINGS_END');
          JS
