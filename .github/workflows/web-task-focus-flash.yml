name: Web task focus DeepSeek Flash
on:
  push:
    branches: [feat/task-focus-compact-20261019]
    paths: ['scripts/web-task-focus-flash.mjs']
permissions:
  contents: read
jobs:
  draft:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Ask DeepSeek Flash for compact card CSS
        env:
          DEEPSEEK_REVIEW_API_KEY: ${{ secrets.DEEPSEEK_REVIEW_API_KEY }}
        run: node scripts/web-task-focus-flash.mjs
