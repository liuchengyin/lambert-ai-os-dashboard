name: GLM Flash development
on:
  push:
    branches: [chore/glm-flash-integration]
    paths: ['scripts/glm-flash.mjs', '.github/workflows/glm-flash.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  draft:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Generate bounded Flash draft
        env:
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
        run: node scripts/glm-flash.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: glm-flash-draft
          path: review-output/glm-flash.json
          retention-days: 7
          if-no-files-found: error
