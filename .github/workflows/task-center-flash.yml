name: Task center bounded Flash draft
on:
  push:
    branches: [feat/project-focused-tasks]
    paths: ['scripts/task-center-flash.mjs', '.github/workflows/task-center-flash.yml']
permissions:
  contents: read
jobs:
  draft:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: One Flash call without retry
        env:
          DEEPSEEK_REVIEW_API_KEY: ${{ secrets.DEEPSEEK_REVIEW_API_KEY }}
        run: node scripts/task-center-flash.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: task-center-flash-draft
          path: review-output/task-center-flash.json
