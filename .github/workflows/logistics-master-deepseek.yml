name: Logistics Master bounded DeepSeek Flash safety review
on:
  push:
    branches: [feat/logistics-master-x6-v1-20261030]
    paths: ['.github/workflows/logistics-master-deepseek.yml','docs/logistics-master-deepseek-prompt.md']
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Local request size preflight
        run: node scripts/codex/model-assist.mjs --provider deepseek --task review --prompt-file docs/logistics-master-deepseek-prompt.md --file logistics-master-model.js --file tests/logistics-master-model.test.mjs
      - name: DeepSeek Flash read-only model and data-safety review
        env:
          DEEPSEEK_REVIEW_API_KEY: ${{ secrets.DEEPSEEK_REVIEW_API_KEY }}
        run: node scripts/codex/model-assist.mjs --provider deepseek --task review --prompt-file docs/logistics-master-deepseek-prompt.md --file logistics-master-model.js --file tests/logistics-master-model.test.mjs --run
      - name: Publish review summary and precise token usage
        run: |
          node --input-type=module - <<'JS'
          import fs from 'node:fs';
          const dir='.codex-local/assist';
          const rows=fs.readdirSync(dir).filter(f=>f.endsWith('.json')&&f!=='ledger.json').map(f=>JSON.parse(fs.readFileSync(dir+'/'+f,'utf8')));
          const r=rows.find(x=>x.provider==='deepseek'&&x.task==='review');
          if(!r)throw Error('deepseek_report_missing');
          console.log(JSON.stringify({model:r.reportedModel,usage:r.usage,retries:r.retries}));
          console.log('DEEPSEEK_REVIEW_BEGIN\n'+r.output.slice(0,3800)+'\nDEEPSEEK_REVIEW_END');
          JS
