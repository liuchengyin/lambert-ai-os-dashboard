name: Logistics V2.3 DeepSeek Flash static review
# Concise 200-character review prompt to avoid incomplete provider responses.
on:
  push:
    branches: [feat/web-logistics-flow-color-20261028]
    paths: ['.github/workflows/logistics-flow-deepseek.yml']
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Budget and source preflight (zero requests)
        run: node scripts/codex/model-assist.mjs --provider deepseek --task review --prompt-file docs/logistics-v2-3-deepseek-prompt.md --file logistics-flow-model.js
      - name: Exactly one DeepSeek Flash independent review
        env:
          DEEPSEEK_REVIEW_API_KEY: ${{ secrets.DEEPSEEK_REVIEW_API_KEY }}
        run: node scripts/codex/model-assist.mjs --provider deepseek --task review --prompt-file docs/logistics-v2-3-deepseek-prompt.md --file logistics-flow-model.js --run
      - name: Print actual model, tokens and findings
        if: success()
        run: |
          node --input-type=module - <<'JS'
          import fs from 'node:fs';
          const reports=fs.readdirSync('.codex-local/assist').filter(f=>f.endsWith('.json')&&f!=='ledger.json').map(f=>JSON.parse(fs.readFileSync('.codex-local/assist/'+f,'utf8')));
          const r=reports.find(x=>x.task==='review'&&x.provider==='deepseek');
          if(!r)throw Error('DeepSeek review report missing');
          console.log(JSON.stringify({requestedModel:r.requestedModel,reportedModel:r.reportedModel,usage:r.usage,retries:r.retries}));
          console.log('FLASH_REVIEW_BEGIN\n'+r.output.slice(0,10000)+'\nFLASH_REVIEW_END');
          JS
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: logistics-v23-deepseek
          path: .codex-local/assist/*.json
          include-hidden-files: true
          retention-days: 14
