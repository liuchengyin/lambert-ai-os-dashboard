name: Links full width DeepSeek draft
on:
  pull_request:
    types: [opened]
    paths: ['docs/links-full-width-request.md']
permissions:
  contents: read
jobs:
  draft:
    if: github.head_ref == 'feat/web-links-full-width' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate code suggestion without applying it
        env:
          DEEPSEEK_REVIEW_API_KEY: ${{ secrets.DEEPSEEK_REVIEW_API_KEY }}
        run: npm run ai:assist -- --provider deepseek --task draft --prompt-file docs/links-full-width-request.md --file links.html --run
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: links-full-width-deepseek
          path: .codex-local/assist/*.json
          include-hidden-files: true
          retention-days: 7
