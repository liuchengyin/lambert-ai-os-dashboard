name: DeepSeek startup performance draft
on:
  push:
    branches: [fix/web-startup-performance-20261118]
    paths: ['docs/performance/startup-v1-deepseek-request.md','.github/workflows/startup-perf-deepseek.yml']
permissions:
  contents: read
jobs:
  assist:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: DeepSeek Flash restricted source draft
        env:
          DEEPSEEK_REVIEW_API_KEY: ${{ secrets.DEEPSEEK_REVIEW_API_KEY }}
        run: node scripts/codex/model-assist.mjs --provider deepseek --task draft --prompt-file docs/performance/startup-v1-deepseek-request.md --file shared-sync/bootstrap.mjs --file project-v4.js --file sprint1-navigation.js --run
      - name: Display usage and draft
        if: success()
        run: |
          node --input-type=module <<'JS'
          import {readdir,readFile} from 'node:fs/promises';
          for(const name of await readdir('.codex-local/assist'))if(name.endsWith('.json')&&name!=='ledger.json')console.log(await readFile('.codex-local/assist/'+name,'utf8'));
          JS
