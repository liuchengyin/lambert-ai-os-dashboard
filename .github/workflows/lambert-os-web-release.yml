name: Lambert OS Web Release Gate
on:
  push:
    branches:
      - release/lambert-master-draw-reading-20261031
      - main
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  web-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and model regression
        run: |
          node --check logistics-knowledge-v1.js
          node --check master-page-v2.js
          node --check master-library-v2.js
          node --check logistics-drawio-bridge.js
          node --check logistics-drawio-model.js
          node --check reading-v2.js
          node --check reading-bookshelf.mjs
          node --check project-v4.js
          node tests/logistics-drawio-model.test.mjs
          node tests/logistics-v35-model.test.mjs
          node tests/logistics-wiring-v36-model.test.mjs
      - name: Prepare browser and PDF runtime
        run: |
          python3 scripts/build-reading-assets.py
          npm install --no-save --no-package-lock playwright@1.56.0
          npx playwright install --with-deps chromium
      - name: User-journey regression (files, logistics, reading)
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/lambert-web-release.log 2>&1 &
          sleep 2
          TEST_ORIGIN=http://127.0.0.1:8765 node tests/master-files-v2-ui.mjs
          TEST_ORIGIN=http://127.0.0.1:8765 node tests/logistics-compact-ui.mjs
          TEST_ORIGIN=http://127.0.0.1:8765 node tests/reading-footer-master-ui.mjs
          TEST_BASE_URL=http://127.0.0.1:8765 node tests/reading-bookshelf.mjs
          TEST_BASE_URL=http://127.0.0.1:8765 node tests/reading-dual-tab.mjs
