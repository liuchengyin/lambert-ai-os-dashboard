name: Workspace UI Smoke
on:
  pull_request:
    paths:
      - 'knowledge-links.js'
      - 'knowledge-itab-v2.css'
      - 'api/link-metadata.js'
      - 'lib/link-metadata.js'
      - 'lib/link-sites.js'
      - 'tests/link-metadata.mjs'
      - 'tests/common-links-ui.mjs'
      - 'api/feishu-targets.js'
      - 'api/feishu-daily.js'
      - 'lib/feishu-targets.js'
      - 'archive-targets.js'
      - 'archive-targets.css'
      - 'reading-v2.js'
      - 'chrome-extension/**'
      - 'tests/archive-targets-ui.mjs'
      - 'tests/feishu-targets.mjs'
      - 'index.html'
      - 'app.js'
      - 'deepseek-v1.js'
      - 'project-ai.js'
      - 'tests/project-ai-ui.mjs'
      - 'deepseek-v1.css'
      - 'api/ai-analyze.js'
      - 'ai-chat.js'
      - 'lib/ai-chat-contract.js'
      - 'tests/ai-chat-api.mjs'
      - 'tests/ai-chat-ui.mjs'
      - 'tests/ai-login-ui.mjs'
      - 'tests/deepseek-api-smoke.mjs'
      - 'tests/deepseek-ui-smoke.mjs'
      - 'dashboard-v5.js'
      - 'task-board-v6.css'
      - 'ui-polish-v3.js'
      - 'ui-polish-v3.css'
      - 'reading-history-bridge.js'
      - 'daily-modules.js'
      - 'reading-v2.js'
      - 'reading-extension-import.js'
      - 'writing-history-link.js'
      - 'chrome-extension/dashboard-sync.js'
      - 'tests/audit-cleanup-ui.mjs'
      - 'project-v3.css'
      - 'sprint1-navigation.js'
      - 'tests/ui-batch.mjs'
      - 'task-center.js'
      - 'task-center.css'
      - 'sprint1-hub.css'
      - 'english-app.html'
      - 'manifest.webmanifest'
      - 'brand/**'
      - 'project-v3.js'
      - 'project-v4.js'
      - 'task-drag-v1.js'
      - 'review-v6.js'
      - 'workspace-glass-v1.css'
      - 'review-layout-v7.css'
      - 'tests/workspace-ui-smoke.mjs'
      - '.github/workflows/workspace-ui-smoke.yml'
permissions:
  contents: read
concurrency:
  group: workspace-ui-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.0
          npx playwright install --with-deps chromium
      - name: Run DeepSeek API security smoke (mocked, no API key)
        run: |
          node tests/deepseek-api-smoke.mjs
          node tests/ai-chat-api.mjs
          node tests/link-metadata.mjs
          node tests/feishu-targets.mjs
      - name: Run workspace UI regression
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 &
          sleep 2
          node tests/ui-batch.mjs
          node tests/project-ai-ui.mjs
          node tests/audit-cleanup-ui.mjs
          node tests/common-links-ui.mjs
          node tests/bookmark-density-ui.mjs
          node tests/archive-targets-ui.mjs
          node tests/workspace-ui-smoke.mjs
          node tests/deepseek-ui-smoke.mjs
          node tests/ai-chat-ui.mjs
          node tests/ai-login-ui.mjs
      - name: Upload visual previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workspace-ui-preview
          path: tests/screenshots/*.png
          if-no-files-found: ignore
      - name: Upload failure screenshot
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: workspace-ui-failure
          path: workspace-ui-smoke-failure.png
          if-no-files-found: ignore
