name: Logistics P0 DeepSeek Flash review
on:
  push:
    branches: [feat/web-logistics-canvas-p0-20261028]
    paths: ['.github/workflows/logistics-p0-deepseek.yml']
permissions:
  contents: read
jobs:
  deepseek-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Source and budget preflight - no model call
        run: node scripts/codex/model-assist.mjs --provider deepseek --task review --prompt-file docs/logistics-p0-deepseek-review.md --file logistics-canvas-model.js --file tests/logistics-canvas-logic.test.mjs
      - name: Exactly one DeepSeek Flash review request
        env:
          DEEPSEEK_REVIEW_API_KEY: ${{ secrets.DEEPSEEK_REVIEW_API_KEY }}
        run: node scripts/codex/model-assist.mjs --provider deepseek --task review --prompt-file docs/logistics-p0-deepseek-review.md --file logistics-canvas-model.js --file tests/logistics-canvas-logic.test.mjs --run
      - name: Show provider model/usage and review findings
        if: success()
        run: |
          node --input-type=module - <<'JS'
          import fs from 'node:fs';
          const dir='.codex-local/assist';
          const reports=fs.readdirSync(dir).filter(name=>name.endsWith('.json')&&name!=='ledger.json').map(name=>JSON.parse(fs.readFileSync(dir+'/'+name,'utf8')));
          const r=reports.find(x=>x.task==='review'&&x.provider==='deepseek');
          if(!r)throw Error('review_missing');
          console.log(JSON.stringify({requestedModel:r.requestedModel,reportedModel:r.reportedModel,usage:r.usage,elapsedMs:r.elapsedMs,retries:r.retries}));
          console.log('FLASH_FINDINGS_START\n'+r.output.slice(0,5500)+'\nFLASH_FINDINGS_END');
          JS
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: logistics-p0-deepseek-report
          path: .codex-local/assist/*.json
          include-hidden-files: true
          retention-days: 14
