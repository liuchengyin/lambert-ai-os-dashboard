name: Logistics P0 node-first DeepSeek Flash safety audit
on:
  push:
    branches: [feat/logistics-node-first-p0-20261029]
    paths: ['.github/workflows/logistics-node-first-deepseek.yml']
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Estimate budget, do not call model
        run: node scripts/codex/model-assist.mjs --provider deepseek --task review --prompt-file docs/logistics-node-first-deepseek-prompt.md --file logistics-v35-model.js --file logistics-trigger-v33.js --file logistics-canvas-model.js
      - name: One DeepSeek Flash safety review
        env:
          DEEPSEEK_REVIEW_API_KEY: ${{ secrets.DEEPSEEK_REVIEW_API_KEY }}
        run: node scripts/codex/model-assist.mjs --provider deepseek --task review --prompt-file docs/logistics-node-first-deepseek-prompt.md --file logistics-v35-model.js --file logistics-trigger-v33.js --file logistics-canvas-model.js --run
      - name: Output audit and exact usage
        if: success()
        run: |
          node --input-type=module - <<'JS'
          import fs from 'node:fs';
          const dir='.codex-local/assist';
          const reports=fs.readdirSync(dir).filter(f=>f.endsWith('.json')&&f!=='ledger.json').map(f=>JSON.parse(fs.readFileSync(dir+'/'+f,'utf8')));
          const r=reports.find(x=>x.provider==='deepseek'&&x.task==='review');
          if(!r)throw Error('missing DeepSeek report');
          console.log(JSON.stringify({model:r.reportedModel,usage:r.usage,retries:r.retries}));
          console.log('DEEPSEEK_AUDIT_START\n'+r.output.slice(0,3400)+'\nDEEPSEEK_AUDIT_END');
          JS
