name: DeepSeek Flash Independent Review
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deepseek-flash-independent-review
  cancel-in-progress: false
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check review harness without paid calls
        run: node tests/deepseek-flash-review.mjs
      - name: Review task card legacy layers (one Flash request)
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_REVIEW_API_KEY }}
        run: node scripts/deepseek-flash-review.mjs --run
      - name: Upload independent report
        uses: actions/upload-artifact@v4
        with:
          name: deepseek-flash-independent-review
          path: review-output/
          if-no-files-found: error
          retention-days: 14
