name: DeepSeek Flash Independent Review
on:
  push:
    branches: [feat/web-home-ai-layout]
    paths: ['.github/workflows/deepseek-flash-review.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deepseek-flash-independent-review
  cancel-in-progress: false
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check review harness without paid calls
        run: node tests/deepseek-flash-review.mjs
      - name: Review selected scope (one Flash request)
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_REVIEW_API_KEY }}
        run: |
          if [ "$GITHUB_REF_NAME" = feat/web-home-ai-layout ]; then
            node scripts/deepseek-flash-review.mjs --run --home-ui
          else
            node scripts/deepseek-flash-review.mjs --run
          fi
      - name: Upload independent report
        uses: actions/upload-artifact@v4
        with:
          name: deepseek-flash-independent-review
          path: review-output/
          if-no-files-found: error
          retention-days: 14
