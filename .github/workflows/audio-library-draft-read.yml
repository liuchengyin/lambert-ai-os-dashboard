name: Read existing audio module drafts without model calls
on:
  push:
    branches: [feat/english-audio-library-v1]
    paths: ['.github/workflows/audio-library-draft-read.yml']
permissions:
  contents: read
  actions: read
jobs:
  read:
    runs-on: ubuntu-24.04
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: liuchengyin/lambert-ai-os-dashboard
        run: |
          gh run download 40093171040 --name audio-library-model-drafts --dir /tmp/audio-model-drafts
          python3 - <<'PY'
          from pathlib import Path
          import json,zlib,base64
          payload={p.name:json.loads(p.read_text()) for p in Path('/tmp/audio-model-drafts').glob('*.json')}
          encoded=base64.b64encode(zlib.compress(json.dumps(payload,ensure_ascii=False).encode(),9)).decode()
          for offset in range(0,len(encoded),1000):
              print('::notice title=Audio draft transfer::'+json.dumps({'offset':offset,'total':len(encoded),'data':encoded[offset:offset+1000]}))
          PY
