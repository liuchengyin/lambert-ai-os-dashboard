name: PDF reading modes regression
on:
  push:
    branches: [feat/web-reading-modes-20261031]
    paths: ['reading-pdf-viewer.mjs','reading-bookshelf.mjs','tests/reading-pdf-modes.mjs','tests/reading-bookshelf.mjs','.github/workflows/reading-modes-ci.yml']
  pull_request:
    paths: ['reading-pdf-viewer.mjs','reading-bookshelf.mjs','tests/reading-pdf-modes.mjs','tests/reading-bookshelf.mjs','.github/workflows/reading-modes-ci.yml']
permissions:
  contents: read
jobs:
  reading-modes:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare pinned browser and PDF runtime
        run: |
          npm ci --prefix shared-sync/tooling --no-audit --no-fund
          ln -s shared-sync/tooling/node_modules node_modules
          node node_modules/playwright/cli.js install --with-deps chromium
          python3 scripts/build-reading-assets.py
      - name: Syntax and real Chromium regression
        run: |
          node --check reading-pdf-viewer.mjs
          node --check reading-bookshelf.mjs
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/reading-modes-http.log 2>&1 &
          TEST_BASE_URL=http://127.0.0.1:8765 node tests/reading-pdf-modes.mjs
          TEST_BASE_URL=http://127.0.0.1:8765 node tests/reading-bookshelf.mjs
          TEST_BASE_URL=http://127.0.0.1:8765/ node tests/reading-dual-tab.mjs
