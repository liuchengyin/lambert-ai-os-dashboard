name: Logistics V3.5 vertical layout DeepSeek Flash review
on:
  push:
    branches: [fix/logistics-v35-vertical-linehaul-20261029]
    paths: ['.github/workflows/logistics-v35-vertical-deepseek.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate scope and preview cost
        run: node scripts/codex/model-assist.mjs --provider deepseek --task review --prompt-file docs/logistics-v35-vertical-deepseek.md --file logistics-v35.css --file logistics-overview.js
      - name: Single DeepSeek Flash audit
        env:
          DEEPSEEK_REVIEW_API_KEY: ${{ secrets.DEEPSEEK_REVIEW_API_KEY }}
        run: node scripts/codex/model-assist.mjs --provider deepseek --task review --prompt-file docs/logistics-v35-vertical-deepseek.md --file logistics-v35.css --file logistics-overview.js --run
      - name: Display audit and usage
        if: success()
        run: |
          node --input-type=module - <<'JS'
          import fs from 'node:fs';
          const files=fs.readdirSync('.codex-local/assist').filter(f=>f.endsWith('.json')&&f!=='ledger.json');
          const reports=files.map(f=>JSON.parse(fs.readFileSync('.codex-local/assist/'+f,'utf8')));
          const r=reports.find(x=>x.provider==='deepseek'&&x.task==='review');
          if(!r)throw Error('missing DeepSeek report');
          console.log(JSON.stringify({model:r.reportedModel,usage:r.usage,retries:r.retries}));
          console.log('DEEPSEEK_AUDIT_START\n'+r.output.slice(0,4000)+'\nDEEPSEEK_AUDIT_END');
          JS
