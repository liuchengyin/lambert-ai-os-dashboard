name: Web startup performance V1
on:
  pull_request:
    paths:
      - 'shared-sync/bootstrap.mjs'
      - 'tests/startup-performance.mjs'
      - '.github/workflows/startup-performance.yml'
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Startup early-paint and fallback tests
        run: node tests/startup-performance.mjs
      - name: Code syntax check
        run: node --check shared-sync/bootstrap.mjs
