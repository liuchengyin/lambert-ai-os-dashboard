name: Interaction DeepSeek Flash development
on:
  push:
    branches: [feat/ui-batch-navigation]
    paths: ['scripts/interaction-dev.mjs']
permissions:
  contents: read
jobs:
  draft:
    strategy:
      fail-fast: false
      matrix:
        part: [project, task, ai]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - env:
          DEEPSEEK_REVIEW_API_KEY: ${{ secrets.DEEPSEEK_REVIEW_API_KEY }}
        run: node scripts/interaction-dev.mjs ${{ matrix.part }}
