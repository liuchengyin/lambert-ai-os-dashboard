name: Independent accounts DeepSeek drafts
on:
  push:
    branches: [feat/web-independent-accounts]
    paths: ['docs/independent-accounts/*-draft.md', 'docs/independent-accounts/privacy-tests.md']
permissions:
  contents: read
jobs:
  drafts:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Bounded storage, tests and audio drafts
        env:
          DEEPSEEK_REVIEW_API_KEY: ${{ secrets.DEEPSEEK_REVIEW_API_KEY }}
        run: |
          node scripts/codex/model-assist.mjs --provider deepseek --task draft --prompt-file docs/independent-accounts/storage-draft.md --run
          node scripts/codex/model-assist.mjs --provider deepseek --task draft --prompt-file docs/independent-accounts/privacy-tests.md --run
          node scripts/codex/model-assist.mjs --provider deepseek --task draft --prompt-file docs/independent-accounts/audio-draft.md --file english-audio-store.mjs --run
      - name: Show actual usage and reviewable suggestions
        if: always()
        run: node -e "const fs=require('fs');for(const p of fs.readdirSync('.codex-local/assist'))if(p.endsWith('.json'))console.log(fs.readFileSync('.codex-local/assist/'+p,'utf8'));"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: independent-account-assist
          path: .codex-local/assist/*.json
          include-hidden-files: true
          retention-days: 14
