name: Common Links Flash Review
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run real recognition cases and one Flash review
        env:
          DEEPSEEK_REVIEW_API_KEY: ${{ secrets.DEEPSEEK_REVIEW_API_KEY }}
        run: node scripts/review-common-links.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: common-links-flash-review
          path: review-output/common-links-flash.json
          retention-days: 14
