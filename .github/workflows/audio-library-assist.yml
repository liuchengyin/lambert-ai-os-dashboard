name: Audio library bounded model module drafts
on:
  push:
    branches: [feat/english-audio-library-v1]
    paths: ['.github/workflows/audio-library-assist.yml']
permissions:
  contents: read
jobs:
  draft:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: One request per authorized model; no fallback or retries
        env:
          DEEPSEEK_REVIEW_API_KEY: ${{ secrets.DEEPSEEK_REVIEW_API_KEY }}
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
        run: node scripts/audio-library-assist.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: audio-library-model-drafts
          path: review-output/audio-assist/
          if-no-files-found: error
