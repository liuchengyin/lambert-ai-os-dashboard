name: Mobile audio DeepSeek assistance
on:
  push:
    branches: [feat/android-audio-tab]
    paths: ['docs/mobile-audio/*-draft.md','docs/mobile-audio/native-review.md']
permissions:
  contents: read
jobs:
  assist:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Bounded draft and native safety review
        env:
          DEEPSEEK_REVIEW_API_KEY: ${{ secrets.DEEPSEEK_REVIEW_API_KEY }}
        run: |
          node scripts/codex/model-assist.mjs --provider deepseek --task draft --prompt-file docs/mobile-audio/store-draft.md --run
          node scripts/codex/model-assist.mjs --provider deepseek --task review --prompt-file docs/mobile-audio/native-review.md --run
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-audio-assist
          path: .codex-local/assist/*.json
          include-hidden-files: true
