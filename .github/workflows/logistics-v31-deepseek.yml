name: Logistics V3.1 bounded DeepSeek safety review
on:
  push:
    branches: [feat/logistics-v31-editor-20261028]
    paths: ['.github/workflows/logistics-v31-deepseek.yml']
permissions:
  contents: read
jobs:
  safety-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Budget preflight with zero model calls
        run: node scripts/codex/model-assist.mjs --provider deepseek --task review --prompt-file docs/logistics-v31-deepseek-prompt.md --file logistics-editor-v31.js
      - name: One bounded DeepSeek Flash review
        env:
          DEEPSEEK_REVIEW_API_KEY: ${{ secrets.DEEPSEEK_REVIEW_API_KEY }}
        run: node scripts/codex/model-assist.mjs --provider deepseek --task review --prompt-file docs/logistics-v31-deepseek-prompt.md --file logistics-editor-v31.js --run
      - name: Show model usage and findings
        if: success()
        run: |
          node --input-type=module - <<'JS'
          import fs from 'node:fs';
          const dir='.codex-local/assist';
          const list=fs.readdirSync(dir).filter(f=>f.endsWith('.json')&&f!=='ledger.json').map(f=>JSON.parse(fs.readFileSync(dir+'/'+f,'utf8')));
          const report=list.find(r=>r.task==='review'&&r.provider==='deepseek');
          if(!report)throw Error('flash_report_missing');
          console.log(JSON.stringify({model:report.reportedModel,usage:report.usage,retries:report.retries}));
          console.log('FLASH_FINDINGS_START\n'+report.output.slice(0,3200)+'\nFLASH_FINDINGS_END');
          JS
