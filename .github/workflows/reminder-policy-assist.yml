name: Reminder bounded DeepSeek Flash draft
on:
  push:
    branches: [feat/web-feishu-reminders-v1]
    paths: ['docs/reminders/policy-draft.md']
permissions:
  contents: read
jobs:
  draft:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: One actual draft, no retry or fallback
        env:
          DEEPSEEK_REVIEW_API_KEY: ${{ secrets.DEEPSEEK_REVIEW_API_KEY }}
        run: node scripts/codex/model-assist.mjs --provider deepseek --task draft --prompt-file docs/reminders/policy-draft.md --run
      - name: Usage metadata and compressed suggestion (not executed)
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,zlib,base64
          for p in Path('.codex-local/assist').glob('*.json'):
              if p.name=='ledger.json':continue
              d=json.loads(p.read_text());print('::notice title=Actual DeepSeek usage::'+json.dumps({k:v for k,v in d.items() if k!='output'}))
              if 'output' in d:
                  s=base64.b64encode(zlib.compress(d['output'].encode())).decode()
                  for i in range(0,len(s),1000):print('::notice title=Draft chunk '+str(i//1000)+'::'+s[i:i+1000])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reminder-flash-draft
          path: .codex-local/assist/*.json
          include-hidden-files: true
          retention-days: 7
