<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI 接班工作室 · Lambert OS</title>
<link rel="stylesheet" href="ai-studio.css"><body><header><a href="/?view=home">← Lambert OS</a><h1>AI 接班工作室</h1><a href="account.html">我的账户</a></header>
<p id="notice" role="status">正在连接工作室…</p><main><aside><h2>模型连接</h2><div id="providers"></div><button id="smoke">测试 DeepSeek 连接</button><p>发送一次固定 OK 请求，使用独立 API 额度。</p>
<h2>新开发任务</h2><form id="create"><label>目标<textarea id="goal" required minlength="3" maxlength="3000"></textarea></label><label>约束<textarea id="constraints" maxlength="3000"></textarea></label><label>验收标准<textarea id="acceptance" maxlength="3000"></textarea></label><label>允许修改的文件（最多4个）<select id="files" multiple size="5"></select></label><button>保存任务</button></form><h2>任务记录</h2><div id="tasks"></div></aside>
<section><h2 id="title">选择任务</h2><p id="state"></p><nav><button id="resume">继续</button><button id="pause">暂停</button><select id="provider"><option value="deepseek">DeepSeek</option><option value="glm">GLM</option></select><button id="switch">切换执行模型</button><button id="export">导出交接记录</button></nav><p>暂停在当前步骤完成后生效；模型切换不重复执行上一动作。</p><details><summary>自动接班条件</summary><select id="errors" multiple size="5"><option value="rate_limit" selected>限流</option><option value="timeout" selected>超时</option><option value="quota" selected>额度不足</option><option value="service" selected>服务错误</option><option value="connection">连接失败</option></select><button id="policy">保存接班条件</button></details><pre id="events"></pre></section></main><script type="module" src="ai-studio.js"></script></body></html>
