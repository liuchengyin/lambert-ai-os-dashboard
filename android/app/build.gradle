plugins { id 'com.android.application' }
android {
 namespace 'app.lambert.tasks'
 compileSdk 35
 def audioPreview=project.hasProperty('audioPreview')
 def stableSigning=project.hasProperty('stableSigning')
 if(stableSigning && !['ANDROID_SIGNING_KEYSTORE','ANDROID_SIGNING_STORE_PASSWORD','ANDROID_SIGNING_KEY_ALIAS'].every { System.getenv(it) }){ throw new GradleException('Stable signing credentials are required; refusing to generate a replacement key') }
 defaultConfig { applicationId(stableSigning?'app.lambert.tasks':'app.lambert.tasks.trial'); minSdk 26; targetSdk 35; versionCode 19; versionName '0.2.8'; testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'; manifestPlaceholders=[appLabel:audioPreview?'Lambert 音频预览':'Lambert']; if(audioPreview){applicationIdSuffix '.audiopreview'} }
 signingConfigs { debug { storeFile file(stableSigning?System.getenv('ANDROID_SIGNING_KEYSTORE'):audioPreview?'/tmp/lambert-audio-preview.keystore':System.getProperty('user.home')+'/.android/lambert-trial.keystore'); storePassword stableSigning?System.getenv('ANDROID_SIGNING_STORE_PASSWORD'):'android'; keyAlias stableSigning?System.getenv('ANDROID_SIGNING_KEY_ALIAS'):'androiddebugkey'; keyPassword stableSigning?System.getenv('ANDROID_SIGNING_STORE_PASSWORD'):'android' } }
 buildTypes { debug { debuggable false } }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies { implementation 'androidx.media3:media3-exoplayer:1.5.1'; implementation 'androidx.media3:media3-session:1.5.1'; implementation 'androidx.webkit:webkit:1.12.1'; androidTestImplementation 'androidx.test:runner:1.6.2'; androidTestImplementation 'androidx.test:core:1.6.1'; androidTestImplementation 'androidx.test.ext:junit:1.2.1' }
