<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>角色菜单速查 · 数据管理</title>
<link rel="icon" href="/brand/logo-mark.svg?v=purple-white-1" type="image/svg+xml">
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f6f3;font:15px/1.7 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:#203b39}
.login-top{height:43px;background:#701bd1;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 22px;font-size:16px}.login-top a{color:#eadcff;font-size:14px;text-decoration:none}
.box{max-width:760px;margin:42px auto;padding:26px;background:#fff;border:1px solid #e4e0ea;border-radius:14px;box-shadow:0 8px 30px #2b173a12}
h1{font-size:22px;margin:0 0 8px}p.desc{color:#6c6572;margin:0 0 18px;font-size:13px}
label{display:block;font-weight:600;margin:12px 0 6px}input[type=password]{width:100%;padding:12px;border:1px solid #ded9e6;border-radius:9px;font:inherit}
button{border:0;border-radius:9px;background:#701bd1;color:#fff;padding:11px 18px;cursor:pointer;font:inherit}button:disabled{opacity:.55;cursor:default}
textarea{width:100%;min-height:420px;padding:12px;border:1px solid #ded9e6;border-radius:9px;font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace}
.status{min-height:22px;color:#b04d32;font-size:13px;margin-top:8px}.status.ok{color:#287a5b}
#editor[hidden]{display:none}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
a.back{display:inline-block;margin-top:14px;color:#701bd1;text-decoration:none}
</style>
</head>
<body>
<header class="login-top"><span>角色菜单速查 · 数据管理</span><a href="/role-menu-finder.html">公开查询</a></header>
<main class="box">
  <h1>数据管理登录</h1>
  <p class="desc">输入本工具的独立管理口令即可查看和保存本地快照。此页在阿里云本地运行，不需要外网。</p>
  <form id="login">
    <label for="password">管理口令</label>
    <input id="password" type="password" autocomplete="current-password" required placeholder="输入独立管理口令">
    <div class="row"><button type="submit">进入管理</button></div>
    <div id="loginStatus" class="status" role="status"></div>
  </form>
  <section id="editor" hidden>
    <h2>本地快照数据</h2>
    <p class="desc">这是 <code>role-menu-data.json</code> 的 roles 数组。保存会覆盖当前快照，请确认格式正确。</p>
    <label for="data">roles JSON</label>
    <textarea id="data" spellcheck="false"></textarea>
    <div class="row"><button id="save" type="button">保存到阿里云快照</button><button id="reload" type="button">重新读取</button></div>
    <div id="saveStatus" class="status" role="status"></div>
  </section>
  <a class="back" href="/role-menu-finder.html">返回公开查询</a>
</main>
<script>
const login=document.getElementById('login'),password=document.getElementById('password'),loginStatus=document.getElementById('loginStatus');
const editor=document.getElementById('editor'),data=document.getElementById('data'),save=document.getElementById('save'),reload=document.getElementById('reload'),saveStatus=document.getElementById('saveStatus');
let unlocked=false,pw='';
async function load(){
  const r=await fetch('/role-menu-data.json',{cache:'no-store'});if(!r.ok)throw Error('读取快照失败');
  const d=await r.json();data.value=JSON.stringify(d.roles||[],null,2);
}
login.addEventListener('submit',async e=>{
  e.preventDefault();loginStatus.textContent='';const btn=login.querySelector('button');btn.disabled=true;
  try{
    const r=await fetch('/api/ops-links-unlock',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:password.value})});
    if(!r.ok){const j=await r.json().catch(()=>({}));throw Error(j.error==='not_configured'?'服务端尚未配置口令':'口令不正确')}
    unlocked=true;pw=password.value;password.value='';await load();login.hidden=true;editor.hidden=false;loginStatus.textContent='';
  }catch(err){loginStatus.textContent=err.message||'验证失败'}
  finally{btn.disabled=false}
});
reload.addEventListener('click',async()=>{saveStatus.textContent='';try{await load();saveStatus.className='status ok';saveStatus.textContent='已重新读取'}catch(err){saveStatus.className='status';saveStatus.textContent=err.message}});
save.addEventListener('click',async()=>{
  if(!unlocked)return;saveStatus.textContent='';save.disabled=true;
  try{
    const r=await fetch('/api/ops-data-save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:pw,data:data.value})});
    const j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||'保存失败');
    saveStatus.className='status ok';saveStatus.textContent='已保存 '+j.roles+' 条角色';
  }catch(err){saveStatus.className='status';saveStatus.textContent=err.message||'保存失败'}
  finally{save.disabled=false}
});
</script>
</body>
</html>
