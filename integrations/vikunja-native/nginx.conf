server {
    listen 80;
    server_name _;
    client_max_body_size 20m;
    location ^~ /lambert/ {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache";
    }
    location / {
        proxy_pass http://vikunja:3456;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Accept-Encoding "";
        # The upstream app and API stay together on the same origin.
        # No upstream security headers are removed or weakened.
        sub_filter_once on;
        sub_filter '</head>' '<link rel="stylesheet" href="/lambert/theme.css"></head>';
        sub_filter '</body>' '<script src="/lambert/launcher.js" defer></script></body>';
    }
}
